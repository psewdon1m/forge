name: Record Forge candidate review

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate build run for this exact qualified tag
        required: true
        type: string
      report:
        description: Reviewed Part 12 JSON with public evidence references only
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Bind the candidate run to this qualified tag
        env:
          CANDIDATE_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" = "psewdon1m/forge" && "$CANDIDATE_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          node scripts/qualified-release-ref.mjs > qualified.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_ID" |
            node scripts/release-policy.mjs run candidate "$(jq -r .commit qualified.json)" "$CANDIDATE_ID"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: forge-qualified-delivery
          path: candidate/
      - name: Validate the report against the package and immutable catalog
        env:
          CANDIDATE_ID: ${{ inputs.candidate_run_id }}
          FORGE_RELEASE_PUBLIC_KEY_HEX: ${{ vars.FORGE_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          const { inputs } = JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const report = inputs?.report;
          if (typeof report !== 'string' || !report.length || report.length > 65_535) {
            throw new Error('Expected a bounded Part 12 JSON report');
          }
          try {
            JSON.parse(report);
          } catch {
            throw new Error('The supplied Part 12 report is not valid JSON');
          }
          await writeFile('known-problems-report.json', report, { flag: 'wx' });
          JS
          node scripts/approve-release.mjs candidate known-problems-report.json approval \
            "$(jq -r .version qualified.json)" "$(jq -r .commit qualified.json)" "$CANDIDATE_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-known-problems-review
          path: approval/known-problems-report.json
          if-no-files-found: error
          retention-days: 30
